services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-kinesiology}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DB_URL: ""
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL: "false"
      MAIL_ENABLED: "true"
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - node node_modules/typeorm/cli.js migration:run -d dist/datasource.js && node dist/main.js

volumes:
  pgdata:
